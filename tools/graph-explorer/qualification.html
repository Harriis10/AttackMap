<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; frame-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>AttackMap fleet graph · qualification harness</title>
  <style>
    :root{font:13px/1.4 "Segoe UI",system-ui,sans-serif;color:#152b3e;background:#edf2f6;color-scheme:light}*{box-sizing:border-box}body{margin:0}header{padding:12px 16px;background:#fff;border-bottom:1px solid #bdcbd8}h1{font-size:18px;margin:0 0 4px}p{margin:4px 0;color:#445e74}.controls{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px;align-items:center}button{font:inherit;padding:6px 9px;border:1px solid #a9bac9;border-radius:4px;color:#15334b;background:#fff;cursor:pointer}button:hover{background:#e2f0fa}button:focus-visible{outline:3px solid #b95700;outline-offset:2px}button:disabled{opacity:.5;cursor:default}label{display:flex;gap:5px;align-items:center}input{width:48px;font:inherit}#status{font-weight:600}#result{display:block;width:100%;height:140px;margin-top:8px;font:11px/1.35 Consolas,monospace;border:1px solid #b7c7d4;background:#f7fafc;color:#203e55;padding:7px;white-space:pre}iframe{display:block;width:100%;height:calc(100vh - 340px);min-height:610px;border:0;background:#fff}.compact #result,.compact .description{display:none}.compact iframe{height:calc(100vh - 150px)}.warn{font-weight:650;color:#85501e}#timings{font-variant-numeric:tabular-nums}.busy{color:#8a5200}
  </style>
  <script defer src="qualification.js"></script>
</head>
<body>
  <header>
    <h1>Fleet graph qualification · synthetic data only</h1>
    <p class="description">Separate same-origin test harness. Core oracles are generated fixtures; these controls do not scan repositories. Browser timings are distinct from native integration or product acceptance.</p>
    <div class="controls" aria-label="Fixture loading">
      <button data-fixture="oracle">Load core fleet16 oracle</button><button data-fixture="failed">Load failed-child oracle</button><button data-fixture="normal">Load 1,000 / 3,000</button><button data-fixture="stress">Load 10,000 / 30,000</button>
      <button id="compact">Focus graph</button><button id="download">Download results JSON</button>
    </div>
    <div class="controls" aria-label="Qualification actions">
      <button data-action="collapsed">Collapse repos</button><button data-action="expanded">Expand repos</button><button data-action="preset">Grouped preset</button><button data-action="fcose">Compound fCoSE</button><button data-action="light">Light</button><button data-action="dark">Dark</button><button id="snapshot">Record snapshot</button><label>Trials <input id="trials" type="number" value="3" min="1" max="10"></label><button id="compare">Measure both layouts</button>
    </div>
    <p id="status" role="status" aria-live="polite">Waiting for the isolated graph page.</p><p id="timings">No fixture loaded.</p>
    <textarea id="result" readonly aria-label="Latest qualification result JSON">{ "status": "waiting" }</textarea>
  </header>
  <iframe id="candidate" title="AttackMap isolated Cytoscape candidate" src="/desktop/windows/GraphExplorer.Web/index.html"></iframe>
</body>
</html>
