# WP029 source consumers; Swift/frozen gates remain explicit external requirements.
name: Client contract fixtures
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  client-fixture-suites:
    name: Python shared contract consumer
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: python tools/ci_contract_evidence.py --mode identity --output ci-evidence/python-identity.json
      - name: Supported previous and incompatible shared contracts
        run: >-
          python -m pytest tests/test_run_contract.py tests/test_ui_contract_adapter.py
          tests/test_desktop_workflow_fixtures.py tests/test_desktop_reference.py
          docs/verification/windows-parity/WP029/test_ci_contract_evidence.py
          -q --tb=short --junitxml=ci-evidence/python-contract.xml
      - run: python scripts/verify_setup.py --fresh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-contract-${{ github.sha }}-${{ github.run_attempt }}
          path: ci-evidence/
          if-no-files-found: error
          retention-days: 14
  windows-consumer:
    name: Windows CSharp source contract consumer
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.426"
      - name: Record fixture source and toolchain identity
        run: |
          python tools/ci_contract_evidence.py --mode identity --output ci-evidence/windows-identity.json
          dotnet --info | Out-File ci-evidence/dotnet.txt
      - name: Actual native protocol fixtures
        run: |
          dotnet run --project desktop/windows/EngineProtocol.Tests/EngineProtocol.Tests.csproj --configuration Release -p:NuGetAudit=false 2>&1 | Tee-Object ci-evidence/protocol.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Actual native report adapters
        run: |
          dotnet run --project desktop/windows/ReportAdapter.Tests/ReportAdapter.Tests.csproj --configuration Release -p:NuGetAudit=false 2>&1 | Tee-Object ci-evidence/report-adapters.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-csharp-contract-${{ github.sha }}-${{ github.run_attempt }}
          path: ci-evidence/
          if-no-files-found: error
          retention-days: 14
  analyzer-fixtures:
    name: Linux applicable analyzer fixture (${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: node
            suite: tests/test_ecosystem_node_atproto.py
          - group: php
            suite: tests/test_ecosystem_php.py
          - group: python
            suite: tests/test_ecosystem_python.py
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - name: Require actual applicability and emitted structured signals
        run: python tools/ci_contract_evidence.py --mode analyzers --group ${{ matrix.group }} --output ci-evidence/${{ matrix.group }}-extraction.json
      - name: Expected signals and negative controls
        run: python -m pytest ${{ matrix.suite }} -q --tb=short --junitxml=ci-evidence/${{ matrix.group }}-fixtures.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-${{ matrix.group }}-fixture-${{ github.sha }}-${{ github.run_attempt }}
          path: ci-evidence/
          if-no-files-found: error
          retention-days: 14
  evaluation-corpus:
    name: Linux seed corpus raw evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - name: Actual existing corpus evaluation without relabeling
        run: python tools/ci_contract_evidence.py --mode corpus --output ci-evidence/seed-corpus.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-seed-corpus-${{ github.sha }}-${{ github.run_attempt }}
          path: ci-evidence/
          if-no-files-found: error
          retention-days: 14
