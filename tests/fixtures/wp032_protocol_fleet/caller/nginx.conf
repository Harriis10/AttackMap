upstream api_backend { server api:8443; }
upstream worker_backend { server worker:9000; }
upstream multi_backend { server api:8443; server worker:9000; }
upstream two_ports { server worker:9000; server worker:9001; }
server { server_name api-edge.internal; location / { proxy_pass https://api_backend; } }
server { server_name worker-edge.internal; location / { proxy_pass http://worker_backend; } }
server { server_name multi-edge.internal; location / { proxy_pass http://multi_backend; } }
server { server_name ports-edge.internal; location / { proxy_pass http://two_ports; } }
