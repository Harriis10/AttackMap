# C28 config-extraction fixture: the seam callers dial — Service port 8443.
# The port is *named* "https" as plain metadata (which must NOT invent a served
# scheme); the explicit `appProtocol: https` field positively declares one.
apiVersion: v1
kind: Service
metadata:
  name: auth-api
spec:
  selector:
    app: auth-api
  ports:
    - name: https
      port: 8443
      targetPort: 8443
      appProtocol: https
