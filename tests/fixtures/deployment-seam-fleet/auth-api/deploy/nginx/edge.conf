# C28 config-extraction fixture: nginx edge proxy.
#
# - auth_backend has exactly ONE server: edge.internal fronts auth-api and is
#   extracted as a declared proxy. Its https proxy_pass re-declares the
#   protocol the Service's appProtocol already states (deduped, appProtocol
#   outranks it).
# - feed_backend likewise fronts feed-generator: feed-edge.internal is a
#   declared proxy, and its https proxy_pass is the ONLY protocol declaration
#   for feed-generator (compose declares none).
# - multi_backend has TWO servers: edge-multiple.internal routes to more than
#   one backend — multi-backend proxy routing is out of scope, so it is
#   skipped with an explicit note and never guessed.

upstream auth_backend {
    server auth-api:8443;
}

upstream feed_backend {
    server feed-generator:9000;
}

upstream multi_backend {
    server auth-api:8443;
    server feed-generator:9000;
}

server {
    listen 80;
    server_name edge.internal;
    location / {
        proxy_pass https://auth_backend;
    }
}

server {
    listen 80;
    server_name feed-edge.internal;
    location / {
        proxy_pass https://feed_backend;
    }
}

server {
    listen 80;
    server_name edge-multiple.internal;
    location / {
        proxy_pass http://multi_backend;
    }
}
